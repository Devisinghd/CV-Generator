<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Update Profile — CV Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      html,
      body {
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI,
          Roboto, Helvetica, Arial;
      }
      .spotlight {
        filter: blur(48px);
        opacity: 0.6;
      }
    </style>
  </head>
  <body class="min-h-screen bg-slate-50">
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <div class="absolute left-[-10%] top-[-10%] h-72 w-72 rounded-full bg-indigo-500/20 spotlight"></div>
      <div class="absolute right-[-10%] bottom-[-10%] h-96 w-96 rounded-full bg-fuchsia-500/20 spotlight"></div>
    </div>

    <main class="mx-auto max-w-3xl px-4 py-10 sm:px-6">
      <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
          <h1 class="text-2xl font-extrabold tracking-tight text-slate-900 sm:text-3xl">
            Update Profile
          </h1>
          <p class="mt-1 text-sm text-slate-600">
            Revise your details and keep your CV information up to date.
          </p>
        </div>
        <a
          href="{% url 'dashboard' %}"
          class="inline-flex items-center justify-center rounded-full border border-slate-200 bg-white px-4 py-2 text-sm font-semibold text-slate-700 transition hover:border-slate-300 hover:text-slate-900"
        >
          Back to dashboard
        </a>
      </div>

      <section class="rounded-3xl border border-slate-200 bg-white p-6 shadow-sm sm:p-8">
        <form method="POST" class="grid grid-cols-1 gap-5 sm:grid-cols-2">
          {% csrf_token %}

          <div>
            <label class="mb-1 block text-sm font-semibold text-slate-700" for="name">Name</label>
            <input
              type="text"
              id="name"
              name="name"
              required
              value="{{ profile.name }}"
              class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm outline-none placeholder:text-slate-400 focus:ring-4 focus:ring-indigo-100"
              placeholder="Your full name"
            />
          </div>

          <div>
            <label class="mb-1 block text-sm font-semibold text-slate-700" for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              required
              value="{{ profile.email }}"
              class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm outline-none placeholder:text-slate-400 focus:ring-4 focus:ring-indigo-100"
              placeholder="you@example.com"
            />
          </div>

          <div>
            <label class="mb-1 block text-sm font-semibold text-slate-700" for="phone">Phone</label>
            <input
              type="text"
              id="phone"
              name="phone"
              required
              value="{{ profile.phone }}"
              class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm outline-none placeholder:text-slate-400 focus:ring-4 focus:ring-indigo-100"
              placeholder="e.g. +91 98765 43210"
            />
          </div>

          <div>
            <label class="mb-1 block text-sm font-semibold text-slate-700" for="degree">Degree</label>
            <input
              type="text"
              id="degree"
              name="degree"
              required
              value="{{ profile.degree }}"
              class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm outline-none placeholder:text-slate-400 focus:ring-4 focus:ring-indigo-100"
              placeholder="e.g. B.Tech in CS"
            />
          </div>

          <div>
            <label class="mb-1 block text-sm font-semibold text-slate-700" for="school">School</label>
            <input
              type="text"
              id="school"
              name="school"
              required
              value="{{ profile.school }}"
              class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm outline-none placeholder:text-slate-400 focus:ring-4 focus:ring-indigo-100"
              placeholder="High school / XII"
            />
          </div>

          <div>
            <label class="mb-1 block text-sm font-semibold text-slate-700" for="university">University</label>
            <input
              type="text"
              id="university"
              name="university"
              required
              value="{{ profile.university }}"
              class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm outline-none placeholder:text-slate-400 focus:ring-4 focus:ring-indigo-100"
              placeholder="College / University"
            />
          </div>

          <div class="sm:col-span-2">
            <label class="mb-1 block text-sm font-semibold text-slate-700" for="summary">Summary</label>
            <textarea
              id="summary"
              name="summary"
              rows="4"
              class="w-full min-h-[120px] rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm outline-none placeholder:text-slate-400 focus:ring-4 focus:ring-indigo-100"
              placeholder="Short professional summary"
            >{{ profile.summary }}</textarea>
          </div>

          <div class="sm:col-span-2">
            <label class="mb-1 block text-sm font-semibold text-slate-700" for="previous_work">Previous Work</label>
            <textarea
              id="previous_work"
              name="previous_work"
              rows="3"
              class="w-full min-h-[120px] rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm outline-none placeholder:text-slate-400 focus:ring-4 focus:ring-indigo-100"
              placeholder="Companies, projects, internships, notable work"
            >{{ profile.previous_work }}</textarea>
          </div>

          <div class="sm:col-span-2">
            <label class="mb-1 block text-sm font-semibold text-slate-700" for="skills">Skills</label>
            <input
              type="text"
              id="skills"
              name="skills"
              required
              value="{{ profile.skills }}"
              class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm shadow-sm outline-none placeholder:text-slate-400 focus:ring-4 focus:ring-indigo-100"
              placeholder="e.g. Python, Django, React, SQL"
            />
            <p class="mt-1 text-xs text-slate-500">Comma-separated skills work best.</p>
          </div>

          <div class="sm:col-span-2 mt-2 flex flex-col gap-3 sm:flex-row">
            <button
              type="submit"
              class="w-full rounded-2xl bg-slate-900 px-4 py-3 text-sm font-extrabold text-white transition hover:bg-slate-800 active:scale-[.99]"
            >
              Save Changes
            </button>
            <a
              href="{% url 'dashboard' %}"
              class="w-full rounded-2xl border border-slate-200 px-4 py-3 text-center text-sm font-semibold text-slate-700 transition hover:border-slate-300 hover:bg-slate-50"
            >
              Cancel
            </a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
